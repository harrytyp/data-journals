name: Data Journal Registry Maintenance

on:
  schedule:
    # Run weekly on Monday at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run discovery script
        run: python scripts/discover_candidates.py --max 300

      - name: Check for new candidates
        id: check
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('data/candidates.json')); print(d['verified_candidates'])")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT verified candidate(s)"

      - name: Save discovery summary
        if: steps.check.outputs.count != '0'
        run: python scripts/save_discovery_summary.py

      - name: Commit discovery results
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/discovery_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update discovery candidates [skip ci]"
            git push
            echo "Committed updated discovery candidates"
          else
            echo "No changes to commit"
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CSV
        run: |
          errors=0
          # Check header (strip \r for CRLF safety)
          HEADER=$(head -1 data_journals_characteristics.csv | tr -d '\r')
          EXPECTED="ISSN,journal_title,publisher,URL,data_journal_type"
          if [ "$HEADER" != "$EXPECTED" ]; then
            echo "❌ CSV header mismatch"
            echo "  Expected: $EXPECTED"
            echo "  Got:      $HEADER"
            errors=$((errors+1))
          fi

          # Check each row (strip \r for CRLF safety)
          tail -n +2 data_journals_characteristics.csv | tr -d '\r' | while IFS=',' read -r issn title publisher url type rest; do
            if [ -z "$issn" ]; then
              echo "❌ Empty ISSN"
              errors=$((errors+1))
            fi
            if [ "$type" != "pure" ] && [ "$type" != "mixed" ]; then
              echo "❌ Invalid type '$type' for ISSN $issn"
              errors=$((errors+1))
            fi
          done

          # Check for duplicate ISSNs (strip \r for CRLF safety)
          DUPS=$(tail -n +2 data_journals_characteristics.csv | tr -d '\r' | cut -d',' -f1 | sort | uniq -d)
          if [ -n "$DUPS" ]; then
            echo "❌ Duplicate ISSNs found: $DUPS"
            errors=$((errors+1))
          fi

          if [ $errors -gt 0 ]; then
            echo "❌ CSV validation failed with $errors error(s)"
            exit 1
          fi
          echo "✅ CSV validation passed"

      - name: Regenerate JSON from CSV
        run: python scripts/convert_csv_to_json.py

      - name: Check if JSON changed
        id: json_changed
        run: |
          if ! git diff --quiet -- data/journals.json; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit JSON changes
        if: steps.json_changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/journals.json
          git commit -m "chore: update data/journals.json from CSV"
          git push
